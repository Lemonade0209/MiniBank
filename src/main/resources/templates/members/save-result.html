<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입 완료</title>
</head>
<body>
<main>
    <h1>회원가입 완료</h1>
    <p>회원 정보가 저장되었습니다.</p>

    <dl>
        <div>
            <dt>회원 번호</dt>
            <dd th:text="${member.id}">1</dd>
        </div>
        <div>
            <dt>로그인 ID</dt>
            <dd th:text="${member.loginId}">member1</dd>
        </div>
        <div>
            <dt>이름</dt>
            <dd th:text="${member.name}">홍길동</dd>
        </div>
    </dl>

    <nav aria-label="회원가입 완료 후 이동">
        <a th:href="@{/}">홈으로</a>
        <a th:href="@{/members/add}">다른 회원 가입</a>
    </nav>
</main>
</body>
</html>
