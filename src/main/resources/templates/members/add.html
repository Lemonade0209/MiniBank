<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>회원가입</title>
    <link rel="stylesheet" href="/minibank.css">
</head>
<body>
<main class="page-shell page-shell--narrow">
    <a th:replace="~{fragments/navigation :: brand}"></a>

    <section class="panel">
        <header class="page-header">
            <div>
                <p class="eyebrow">Membership</p>
                <h1>회원가입</h1>
                <p class="lead">MiniBank를 시작할 회원 정보를 입력해 주세요.</p>
            </div>
        </header>

        <form class="form-stack" action="/members/add" method="post">
            <div class="field">
                <label for="loginId">로그인 ID</label>
                <input type="text" id="loginId" name="loginId" autocomplete="username">
            </div>
            <div class="field">
                <label for="password">비밀번호</label>
                <input type="password" id="password" name="password" autocomplete="new-password">
            </div>
            <div class="field">
                <label for="name">이름</label>
                <input type="text" id="name" name="name" autocomplete="name">
            </div>
            <button class="button button--primary" type="submit">가입하기</button>
        </form>
    </section>
</main>
</body>
</html>
