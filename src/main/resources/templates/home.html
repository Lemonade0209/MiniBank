<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MiniBank</title>
    <link rel="stylesheet" href="/minibank.css">
</head>
<body>
<main class="page-shell">
    <section class="hero-card">
        <div class="hero-card__content">
            <div class="hero-card__monogram" aria-hidden="true">M</div>
            <p class="eyebrow">Simple banking, clearly built</p>
            <h1>Mini<span>Bank</span></h1>
            <p class="lead">작지만 분명한 흐름으로 완성해 가는 미니 인터넷뱅킹</p>
            <p class="status-chip">애플리케이션 정상 작동 중</p>
            <nav class="action-row" aria-label="회원 메뉴">
                <a class="button button--quiet" th:href="@{/login}">로그인</a>
                <a class="button button--primary" th:href="@{/members/add}">회원가입</a>
            </nav>
        </div>
    </section>
</main>
</body>
</html>
