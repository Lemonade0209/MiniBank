<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MiniBank</title>
    <link rel="stylesheet" href="/minibank.css">
</head>
<body>
<main class="page-shell">

        <div class="hero-card__content">
            <div class="hero-card__monogram" aria-hidden="true">M</div>

            <h1>Mini<span>Bank</span></h1>
            <p class="lead">은행의 핵심 흐름을 직접 구현하는 미니 인터넷뱅킹</p>
            <p class="status-chip" th:text="${projectStatus}">애플리케이션 정상 작동 중</p>
            <nav th:replace="~{fragments/navigation :: guest-menu}"></nav>
        </div>
    </section>
</main>

</html>
