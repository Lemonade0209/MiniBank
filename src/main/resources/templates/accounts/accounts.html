<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{page.account.list}">계좌 목록</title>
    <link rel="stylesheet" href="/minibank.css">
</head>
<body>
<main class="page-shell">
    <a th:replace="~{fragments/navigation :: brand}"></a>

    <section class="panel">
        <header class="page-header">
            <div>
                <p class="eyebrow">Accounts</p>
                <h1 th:text="#{page.account.list.member(${memberId})}">회원 1의 계좌 목록</h1>
                <p class="lead">이 회원에게 등록된 계좌와 현재 잔액을 확인하세요.</p>
            </div>
            <div class="action-row">
                <a class="button button--quiet" th:href="@{/}"
                   th:text="#{button.home}">홈으로</a>
                <a class="button button--primary"
                   th:href="@{/accounts/add(memberId=${memberId})}"
                   th:text="#{button.account.add}">계좌 개설</a>
            </div>
        </header>

        <p class="status-chip"
           th:if="${param.status}"
           th:text="'계좌 개설이 완료되었습니다.'">계좌 개설 완료</p>

        <div class="table-card">
            <div class="table-scroll">
                <table>
                    <thead>
                    <tr>
                        <th th:text="#{label.account.id}">계좌 ID</th>
                        <th th:text="#{label.account.number}">계좌번호</th>
                        <th th:text="#{label.account.balance}">잔액</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="account : ${accounts}">
                        <td th:text="${account.id}">1</td>
                        <td>
                            <a class="account-number"
                               th:href="@{/accounts/{accountId}(accountId=${account.id},memberId=${account.memberId})}"
                               th:text="${account.accountNumber}">000000000001</a>
                        </td>
                        <td>
                            <span class="money" th:text="${account.balance}">0</span>원
                            <span class="balance-state"
                                  th:if="${account.balance == 0}">입금 전</span>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>
</body>
</html>
