<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{page.account.add}">계좌 개설</title>
    <link rel="stylesheet" href="/minibank.css">
</head>
<body>
<main class="page-shell page-shell--narrow">
    <a th:replace="~{fragments/navigation :: brand}"></a>

    <section class="panel">
        <header class="page-header">
            <div>
                <p class="eyebrow">Open account</p>
                <h1 th:text="#{page.account.add}">계좌 개설</h1>
                <p class="lead">
                    회원 <span th:text="${account.memberId}">1</span>의 새 계좌를 개설합니다.
                </p>
            </div>
        </header>

        <p class="status-chip"
           th:if="${param.joined}"
           th:text="'회원가입이 완료되었습니다.'">회원가입 완료</p>

        <form class="form-stack" action="/accounts/add" th:object="${account}" method="post">
            <input type="hidden" th:field="*{memberId}">
            <div class="action-row">
                <a class="button button--quiet"
                   th:href="@{/accounts(memberId=${account.memberId})}" th:text="#{button.account.list}">목록으로</a>
                <button class="button button--primary" type="submit" th:text="#{button.account.add}">계좌 개설</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
