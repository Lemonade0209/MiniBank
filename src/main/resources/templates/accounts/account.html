<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{page.account.detail}">계좌 상세</title>
    <link rel="stylesheet" href="/minibank.css">
</head>
<body>
<main class="page-shell page-shell--narrow">
    <a th:replace="~{fragments/navigation :: brand}"></a>

    <section class="panel">
        <header class="page-header">
            <div>
                <p class="eyebrow">Account detail</p>
                <h1 th:text="#{page.account.detail}">계좌 상세</h1>
                <p class="lead">계좌의 식별 정보와 현재 잔액입니다.</p>
            </div>
        </header>

        <p class="status-chip"
           th:if="${param.depositStatus}">
            입금이 완료되었습니다.
        </p>

        <dl class="data-list">
            <div class="data-list__item">
                <dt th:text="#{label.account.id}">계좌 ID</dt>
                <dd th:text="${account.id}">1</dd>
            </div>
            <div class="data-list__item">
                <dt th:text="#{label.account.number}">계좌번호</dt>
                <dd class="account-number" th:text="${account.accountNumber}">000000000001</dd>
            </div>
            <div class="data-list__item data-list__item--balance">
                <dt th:text="#{label.account.balance}">잔액</dt>
                <dd><span class="money" th:text="${account.balance}">0</span>원</dd>
            </div>
        </dl>

        <form class="form-stack"
              th:action="@{/accounts/{accountId}/deposit(accountId=${account.id})}"
              th:object="${depositAccount}"
              method="post">
            <div class="field">
                <label for="amount">입금 금액</label>
                <input id="amount"
                       type="text"
                       th:field="*{amount}">

                <p th:if="${#fields.hasErrors('amount')}"
                   th:errors="*{amount}">
                    금액 입력 오류
                </p>

                <p th:if="${amountError}"
                   th:text="${amountError}">
                    입금 금액 오류
                </p>
            </div>

            <button class="button button--primary" type="submit">입금</button>
        </form>

        <div class="action-row">
            <a class="button button--quiet"
               th:href="@{/accounts(memberId=${account.memberId})}"
               th:text="#{button.account.list}">목록으로</a>
        </div>
    </section>
</main>
</body>
</html>
